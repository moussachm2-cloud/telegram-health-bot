services:
  - type: web
    name: telegram-health-bot
    runtime: node
    plan: free
    buildCommand: "echo no build"
    startCommand: "node server.js"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: WEBHOOK_SECRET
        generateValue: true
