services:
  - type: web
    name: telegram-health-bot
    runtime: node
    plan: free
    buildCommand: "echo no build"
    startCommand: "node server.js"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: WEBHOOK_SECRET
        generateValue: true
      # --- Booking (optional; bot works without these) ---
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: TIMEZONE
        value: Africa/Algiers
      - key: WORK_DAYS
        value: "0,1,2,3,4"
      - key: WORK_START
        value: "09:00"
      - key: WORK_END
        value: "17:00"
      - key: SLOT_MINUTES
        value: "30"
      - key: BOOKING_DAYS_AHEAD
        value: "7"
